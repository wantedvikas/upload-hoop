<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Hoop</title>
<style>
  :root { --bg: #ECEAF6; --card: #F7F6FB; --ink: #1E2230; --muted: #8A8DA0; --line: #D9D7E6;
    --hoop: #E8673C; --green: #2F9E6A; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: var(--ink); }
  * { box-sizing: border-box; }
  /* Top-aligned (not centred) so the court never moves while the uploaded list grows */
  body { margin: 0; min-height: 100vh; background: var(--bg); display: grid; justify-items: center; align-content: start; padding: 32px 16px; }
  .card { width: min(440px, 100%); background: var(--card); border-radius: 28px; padding: 22px 20px 18px;
    box-shadow: 0 30px 60px -30px rgba(40, 30, 90, .35), 0 0 0 1px rgba(30, 34, 48, .04); }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.01em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
  .pill { background: #E6E4F0; border-radius: 99px; padding: 6px 12px; font-size: .78rem; color: #555a70; white-space: nowrap; }
  .pill b { display: inline-block; min-width: 1ch; color: var(--ink); }

  .stage { position: relative; height: 430px; margin-top: 14px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .zone { position: absolute; left: 12%; right: 12%; top: 8px; height: 230px; border: 2px dashed var(--line); border-radius: 18px;
    display: flex; flex-direction: column; align-items: center; padding-top: 22px; gap: 4px; color: var(--muted); font-size: .8rem;
    transition: border-color .2s, background .2s; background: #fff; }
  .zone strong { color: var(--ink); font-size: 1rem; }
  .zone svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 4px; }
  .zone.over { border-color: var(--hoop); background: #FFF3EE; }
  .board { position: absolute; left: 50%; top: 128px; width: 128px; height: 74px; margin-left: -64px; border: 3px solid var(--hoop);
    border-radius: 4px; background: #fff; z-index: 1; }
  .board::after { content: ""; position: absolute; left: 50%; bottom: 8px; width: 44px; height: 30px; margin-left: -22px; border: 3px solid var(--hoop); border-radius: 2px; }
  .net { position: absolute; left: 50%; top: 222px; width: 92px; height: 74px; margin-left: -46px; z-index: 4; overflow: visible; transform-origin: 50% 0; }
  .net path { fill: none; stroke: #A9ACBD; stroke-width: 1.4; stroke-linecap: round; }
  .rim { position: absolute; left: 50%; top: 214px; width: 104px; height: 14px; margin-left: -52px; border: 4px solid var(--hoop);
    border-radius: 50%; z-index: 5; }
  .dots { position: absolute; inset: 0; z-index: 6; pointer-events: none; overflow: visible; }
  .dots circle { fill: var(--hoop); }
  .ball { position: absolute; left: 0; top: 0; width: 56px; height: 70px; padding: 0; border: 0; background: none; cursor: grab; z-index: 3;
    touch-action: none; will-change: transform; border-radius: 10px; }
  .ball:active { cursor: grabbing; }
  .ball svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 6px 8px rgba(30, 34, 48, .18)); }
  .ball:focus-visible { outline: 3px solid var(--hoop); outline-offset: 4px; }
  .fname { position: absolute; left: 0; top: 0; z-index: 2; font-size: .72rem; color: #555a70; white-space: nowrap; pointer-events: none;
    transform: translateX(-50%); }
  .pop { position: absolute; z-index: 7; pointer-events: none; font-weight: 800; color: var(--hoop); font-size: 1.3rem; opacity: 0; white-space: nowrap; }
  .shadow { position: absolute; z-index: 0; width: 46px; height: 8px; border-radius: 50%; background: rgba(30, 34, 48, .14); pointer-events: none; }

  .tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
  .pick { position: relative; display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: #fff; border-radius: 99px;
    padding: 10px 16px; font-size: .85rem; font-weight: 700; cursor: pointer; min-height: 44px; }
  .pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .pick:focus-within { outline: 3px solid var(--hoop); outline-offset: 2px; }
  .hint { color: var(--muted); font-size: .8rem; }
  .status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  .list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .list li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; background: #fff; border-radius: 14px; padding: 10px 12px; }
  .list li svg { width: 26px; height: 32px; }
  .list b { display: block; font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list small { color: var(--muted); font-size: .75rem; }
  .bar { height: 4px; background: #EEEDF4; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 99px; }
  .ok { width: 24px; height: 24px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: .8rem; transform: scale(0); }
  .list li.empty { display: block; background: none; color: var(--muted); font-size: .82rem; text-align: center; padding: 8px 0 2px; }
</style>
</head>
<body>
  <main class="card">
    <header>
      <div><h1>Upload files</h1><p>Drag and drop, or take the shot.</p></div>
      <span class="pill">Uploaded <b id="count">0</b></span>
    </header>

    <div class="stage" id="stage">
      <div class="zone" id="zone">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
        <strong>Drop files here</strong><span>or take the shot 🏀</span>
      </div>
      <div class="board" aria-hidden="true"></div>
      <div class="shadow" id="shadow" aria-hidden="true"></div>
      <button class="ball" id="ball" type="button"></button>
      <span class="fname" id="fname" aria-hidden="true"></span>
      <svg class="net" id="net" viewBox="0 0 92 74" aria-hidden="true"></svg>
      <div class="rim" id="rim" aria-hidden="true"></div>
      <svg class="dots" id="dots" aria-hidden="true"></svg>
      <div class="pop" id="pop" aria-hidden="true"></div>
    </div>

    <div class="tools">
      <label class="pick">📎 Choose files<input type="file" id="pick" multiple aria-label="Choose files to shoot into the hoop"></label>
      <span class="hint" id="hint">Pull the file back, aim, let go</span>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <ul class="list" id="list" aria-label="Uploaded files"><li class="empty">Nothing uploaded yet. Score a basket!</li></ul>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script>
  (function () {
    'use strict';
    const g = window.gsap;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const $ = (id) => document.getElementById(id);
    const stage = $('stage'), ball = $('ball'), fname = $('fname'), net = $('net'), rimEl = $('rim'),
      dotsSvg = $('dots'), pop = $('pop'), list = $('list'), count = $('count'), status = $('status'), shadow = $('shadow'), zone = $('zone');

    // ---------- pictures ----------
    const docSvg = (ext, color) => `<svg viewBox="0 0 56 70" aria-hidden="true">
      <path d="M6 4h30l14 14v46a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#fff" stroke="#D3D1E0" stroke-width="2"/>
      <path d="M36 4v12a2 2 0 0 0 2 2h12" fill="#F1F0F7" stroke="#D3D1E0" stroke-width="2"/>
      <path d="M12 26h24M12 33h28M12 40h18" stroke="#C9C7D8" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="10" y="48" width="${ext.length * 7 + 10}" height="13" rx="3" fill="${color}"/>
      <text x="15" y="58" font-size="8.5" font-weight="800" fill="#fff" font-family="system-ui">${ext.toUpperCase()}</text></svg>`;
    const EXT_COLOR = { pdf: '#E5484D', doc: '#3E7BFA', docx: '#3E7BFA', jpg: '#2F9E6A', png: '#2F9E6A', xlsx: '#1F8F4E', zip: '#8E6CEF' };
    const extOf = (name) => (name.split('.').pop() || 'file').slice(0, 4).toLowerCase();

    // Net: crossing strings that narrow toward the bottom.
    (function drawNet() {
      let d = '';
      const rows = [0, 24, 48, 72], half = (y) => 46 - y * 0.32;
      for (let i = 0; i <= 8; i++) {
        for (let r = 0; r < rows.length - 1; r++) {
          const y0 = rows[r], y1 = rows[r + 1];
          const x0 = 46 + half(y0) * (i / 4 - 1), x1a = 46 + half(y1) * ((i + 1) / 4 - 1), x1b = 46 + half(y1) * ((i - 1) / 4 - 1);
          if (i < 8) d += `M${x0} ${y0}L${x1a} ${y1}`;
          if (i > 0) d += `M${x0} ${y0}L${x1b} ${y1}`;
        }
      }
      net.innerHTML = `<path d="${d}"/>`;
    })();

    // ---------- files queue ----------
    const DEMO = ['final_fileeeee.pdf', 'final_FINAL_v2.pdf', 'homework_REAL.docx', 'IMG_2041.jpg', 'budget_dont_open.xlsx', 'memes.zip'];
    let demoI = 0;
    const queue = [];
    const nextFile = () => queue.shift() || { name: DEMO[demoI++ % DEMO.length], size: 120000 + ((demoI * 7919) % 900000) };
    let file = nextFile();
    const fmtSize = (b) => (b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB');

    // ---------- geometry ----------
    const G = 1800, R = 22, RIM_R = 14, K = 8, MAX_PULL = 150; // RIM_R: forgiving rim edges
    let W, H, start, rim;
    function measure() {
      const s = stage.getBoundingClientRect(), r = rimEl.getBoundingClientRect();
      W = s.width; H = s.height;
      start = { x: 58, y: H - 62 };
      rim = { l: r.left - s.left + 6, r: r.right - s.left - 6, y: r.top - s.top + r.height / 2, cx: r.left - s.left + r.width / 2 };
    }

    // ---------- ball state + drawing ----------
    const b = { x: 0, y: 0, vx: 0, vy: 0, rot: 0, vr: 0, sc: 1 };
    let mode = 'idle'; // idle | aim | fly | score
    let touchedRim = false, flyT = 0;
    function place() {
      ball.style.transform = `translate(${b.x - 28}px, ${b.y - 35}px) rotate(${b.rot}deg) scale(${b.sc})`;
      const floorY = H - 26, lift = Math.max(0, floorY - (b.y + 30));
      shadow.style.transform = `translate(${b.x - 23}px, ${floorY}px) scale(${Math.max(0.35, 1 - lift / 300)})`;
      shadow.style.opacity = mode === 'score' ? 0 : Math.max(0.2, 1 - lift / 400);
    }
    function loadBall(animate) {
      const ext = extOf(file.name);
      ball.innerHTML = docSvg(ext, EXT_COLOR[ext] || '#8A8DA0');
      ball.setAttribute('aria-label', `Shoot ${file.name} into the hoop`);
      fname.textContent = file.name.length > 20 ? file.name.slice(0, 17) + '…' : file.name;
      Object.assign(b, { x: start.x, y: start.y, vx: 0, vy: 0, rot: -8, vr: 0, sc: 1 });
      fname.style.left = start.x + 'px'; fname.style.top = (start.y + 40) + 'px';
      mode = 'idle'; touchedRim = false;
      place();
      if (animate && g && !reduce) {
        const o = { s: 0 };
        g.to(o, { s: 1, duration: 0.5, ease: 'back.out(2.2)', onUpdate() { b.sc = o.s; place(); } });
        g.fromTo(fname, { opacity: 0 }, { opacity: 1, duration: 0.4 });
      }
    }

    // ---------- aiming ----------
    function showDots(vx, vy) {
      let html = '';
      for (let i = 1; i <= 14; i++) {
        const t = i * 0.045, x = b.x + vx * t, y = b.y + vy * t + 0.5 * G * t * t;
        html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(3.2 - i * 0.15).toFixed(2)}" opacity="${(1 - i / 16).toFixed(2)}"/>`;
      }
      dotsSvg.innerHTML = html;
    }
    let grab = null;
    ball.addEventListener('pointerdown', (e) => {
      if (mode !== 'idle') return;
      measure();
      grab = { x: e.clientX, y: e.clientY, moved: false };
      ball.setPointerCapture(e.pointerId);
    });
    ball.addEventListener('pointermove', (e) => {
      if (!grab) return;
      let dx = e.clientX - grab.x, dy = e.clientY - grab.y;
      const len = Math.hypot(dx, dy);
      if (len > 6) { grab.moved = true; mode = 'aim'; }
      if (mode !== 'aim') return;
      if (len > MAX_PULL) { dx *= MAX_PULL / len; dy *= MAX_PULL / len; }
      b.x = start.x + dx; b.y = start.y + dy; b.rot = -8 + dx * 0.1; place();
      grab.vx = -dx * K; grab.vy = -dy * K;
      showDots(grab.vx, grab.vy);
    });
    const release = () => {
      if (!grab) return;
      const gr = grab; grab = null; dotsSvg.innerHTML = '';
      if (!gr.moved) return perfectShot(); // a tap / Enter = auto shot
      if (Math.hypot(gr.vx || 0, gr.vy || 0) < 250) return snapBack();
      launch(gr.vx, gr.vy);
    };
    ball.addEventListener('pointerup', release);
    ball.addEventListener('pointercancel', () => { grab = null; dotsSvg.innerHTML = ''; snapBack(); });
    ball.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (mode === 'idle') perfectShot(); } });

    function snapBack() {
      mode = 'idle';
      if (!g) return loadBall(false);
      const o = { x: b.x, y: b.y };
      g.to(o, { x: start.x, y: start.y, duration: 0.45, ease: 'elastic.out(1, 0.5)', onUpdate() { b.x = o.x; b.y = o.y; place(); } });
    }

    // Computes the throw that drops through the middle of the rim.
    function perfectShot() {
      if (mode !== 'idle' && mode !== 'aim') return;
      measure();
      if (reduce) return score(true);
      const T = 0.82, dx = rim.cx - b.x, dy = rim.y - 2 - b.y;
      launch(dx / T, (dy - 0.5 * G * T * T) / T);
    }
    function launch(vx, vy) {
      Object.assign(b, { vx, vy, vr: vx * 0.35 });
      mode = 'fly'; flyT = 0; touchedRim = false;
      g && g.to(fname, { opacity: 0, duration: 0.2 });
    }

    // ---------- physics ----------
    function step(dt) {
      if (mode !== 'fly') return;
      flyT += dt;
      const py = b.y;
      // exact projectile step, so the flight follows the aiming dots precisely
      b.x += b.vx * dt; b.y += b.vy * dt + 0.5 * G * dt * dt; b.vy += G * dt; b.rot += b.vr * dt;
      // Rim ends behave like small round posts, but only for a file coming DOWN:
      // in this front view a rising file passes in front of the rim (a good arc rises close to it).
      for (const ex of b.vy > 0 ? [rim.l, rim.r] : []) {
        const nx = b.x - ex, ny = b.y - rim.y, d = Math.hypot(nx, ny);
        if (d < RIM_R && d > 0) {
          const ux = nx / d, uy = ny / d, vn = b.vx * ux + b.vy * uy;
          if (vn < 0) { b.vx -= 1.55 * vn * ux; b.vy -= 1.55 * vn * uy; b.vr = -b.vr * 0.6; }
          b.x = ex + ux * RIM_R; b.y = rim.y + uy * RIM_R;
          if (!touchedRim) { touchedRim = true; g && g.fromTo(rimEl, { x: -2 }, { x: 0, duration: 0.3, ease: 'elastic.out(1, 0.2)' }); }
        }
      }
      // through the hoop: crossing the rim line going down, between the posts
      if (py < rim.y && b.y >= rim.y && b.vy > 0 && b.x > rim.l + 4 && b.x < rim.r - 4) return score(false);
      // walls + floor
      if (b.x < R) { b.x = R; b.vx = -b.vx * 0.6; }
      if (b.x > W - R) { b.x = W - R; b.vx = -b.vx * 0.6; }
      const floor = H - 36;
      // Only a FALLING file lands. Pulling back aims from below the floor line, and the
      // old check "landed" every slingshot shot on its first frame -> always "Air ball".
      if (b.y > floor && b.vy > 0) {
        b.y = floor; b.vy = -b.vy * 0.42; b.vx *= 0.72; b.vr *= 0.6;
        if (Math.abs(b.vy) < 140) return miss();
      }
      if (flyT > 5) return miss();
      place();
    }
    if (g) g.ticker.add((time, deltaMs) => step(Math.min(deltaMs, 40) / 1000));

    // ---------- outcomes ----------
    function popText(text, x, y) {
      pop.textContent = text;
      if (!g || reduce) return;
      g.fromTo(pop, { x: x, y: y, opacity: 1, scale: 0.6 }, { y: y - 46, scale: 1.1, duration: 0.6, ease: 'back.out(2)' });
      g.to(pop, { opacity: 0, duration: 0.3, delay: 0.75 });
    }
    function say(msg) { status.textContent = msg; }

    function score(instant) {
      mode = 'score';
      const done = () => { addToList(file); file = nextFile(); loadBall(true); if (g) g.set(ball, { opacity: 1 }); };
      if (instant || !g) { place(); say(`${file.name} uploaded.`); return done(); }
      const shot = touchedRim ? 'Nice!' : 'Swish!';
      const o = { x: b.x, y: b.y, s: 1, r: b.rot };
      g.timeline({ onComplete: done })
        .to(o, { x: rim.cx, y: rim.y + 30, s: 0.72, r: 0, duration: 0.16, ease: 'power1.in', onUpdate: upd })
        .to(net, { scaleY: 1.28, scaleX: 0.9, duration: 0.12, ease: 'power2.out' }, 0.05)
        .to(net, { scaleY: 1, scaleX: 1, duration: 0.9, ease: 'elastic.out(1.2, 0.3)' }, 0.17)
        .to(o, { y: rim.y + 92, s: 0.55, duration: 0.25, ease: 'power2.in', onUpdate: upd }, 0.2)
        .to(ball, { opacity: 0, duration: 0.15 }, 0.35);
      popText(`+1 ${shot}`, rim.r + 6, rim.y - 24);
      say(`${shot} ${file.name} uploaded.`);
      function upd() { b.x = o.x; b.y = o.y; b.sc = o.s; b.rot = o.r; place(); }
    }
    function miss() {
      mode = 'score';
      const msg = touchedRim ? 'So close! 😬' : 'Air ball 😅';
      popText(msg, Math.min(Math.max(b.x - 40, 8), W - 130), b.y - 40);
      say(`${msg} Try again.`);
      if (!g) return loadBall(false);
      g.to(ball, { opacity: 0, duration: 0.25, delay: 0.5, onComplete() { loadBall(true); g.set(ball, { opacity: 1 }); } });
    }

    // ---------- uploaded list ----------
    let n = 0;
    function addToList(f) {
      const empty = list.querySelector('.empty'); if (empty) empty.remove();
      const ext = extOf(f.name);
      const li = document.createElement('li');
      li.innerHTML = `${docSvg(ext, EXT_COLOR[ext] || '#8A8DA0')}<div><b></b><small>${fmtSize(f.size)} · <span>Uploading…</span></small><div class="bar"><i></i></div></div><span class="ok" aria-hidden="true">✓</span>`;
      li.querySelector('b').textContent = f.name; // file names are untrusted text
      list.prepend(li);
      n++;
      const label = li.querySelector('small span'), bar = li.querySelector('.bar i'), ok = li.querySelector('.ok');
      const finish = () => { label.textContent = 'Uploaded'; bar.style.width = '100%'; ok.style.transform = 'scale(1)'; };
      if (!g || reduce) { count.textContent = n; return finish(); }
      g.from(li, { height: 0, opacity: 0, y: -10, duration: 0.4, ease: 'power2.out' });
      g.to(bar, { width: '100%', duration: 1.1, ease: 'power1.inOut', onComplete() {
        label.textContent = 'Uploaded';
        g.to(ok, { scale: 1, duration: 0.4, ease: 'back.out(3)' });
      } });
      g.timeline().to(count, { y: -8, opacity: 0, duration: 0.15 }).call(() => { count.textContent = n; })
        .fromTo(count, { y: 8 }, { y: 0, opacity: 1, duration: 0.25, ease: 'back.out(3)' });
    }

    // ---------- real files: choose or drop (stay on this device, never sent) ----------
    function enqueue(files) {
      [...files].forEach((f) => queue.push({ name: f.name, size: f.size }));
      if (!queue.length) return;
      if (mode === 'idle') { file = queue.shift(); loadBall(true); }
      say(`${files.length} file${files.length === 1 ? '' : 's'} ready. Take the shot!`);
    }
    $('pick').addEventListener('change', (e) => { enqueue(e.target.files); e.target.value = ''; });
    ['dragenter', 'dragover'].forEach((t) => stage.addEventListener(t, (e) => { e.preventDefault(); zone.classList.add('over'); }));
    ['dragleave', 'drop'].forEach((t) => stage.addEventListener(t, () => zone.classList.remove('over')));
    stage.addEventListener('drop', (e) => {
      e.preventDefault();
      const files = [...e.dataTransfer.files];
      if (!files.length) return;
      enqueue(files);
      // dropped files get auto-dunked one by one
      let i = 0;
      const go = () => { if (mode === 'idle') { perfectShot(); i++; } if (i < files.length) setTimeout(go, 1500); };
      setTimeout(go, 500);
    });

    addEventListener('resize', () => { measure(); if (mode === 'idle') loadBall(false); });
    measure();
    loadBall(true);
    window.__hoop = { perfectShot, launch: (vx, vy) => { measure(); launch(vx, vy); }, state: () => ({ mode, x: Math.round(b.x), y: Math.round(b.y), n, file: file.name }) };
  })();
  </script>
</body>
</html>
